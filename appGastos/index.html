<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Controle de Gastos</h1>
        <form >
            <input type="number" name="valor" placeholder="Digite o valor do gasto"><br><br>
            <select name="categoria">
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Moradia">Moradia</option>
                <option value="Lazer">Lazer</option>
            </select><br><br>
            <button type="submit">Adicionar Gasto</button>
            <!--<button type="button" >Adicionar Gasto</button>-->
        </form>
        <p id="Alimentação">Alimentação: R$ 0,00</p>
        <p id="Transporte">Transporte: R$ 0,00</p>
        <p id="Moradia">Moradia: R$ 0,00</p>
        <p id="Lazer">Lazer: R$ 0,00</p>
        <p id="Total">Total: R$ 0,00</p>
    </main>
    
    <script type=module src="./js/app.js"></script>
</body>
</html>
