<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="exepmlo.css">
</head>
<body>
    <main>
        <h1>Exemplo de media queries</h1>
        <p>Redimensione a janela do navegador para ver o efeito</p>
        <p class="mobile-message">Você está visualizando em um dispositivo móvel</p>

        <h2>Pontos de quebra (breakpoints)</h2>
        <ul>
            <li>Mobile: até 600px</li>
            <li>Tablet: 601px a 900px</li>
            <li>Desktop: acima de 901px</li>
        </ul>
    </main>
</body>
</html>
